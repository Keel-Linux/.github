# Light CI on GitHub-hosted runners, for pull requests on the GitHub mirror
# (decision 0056). The full CI is .forgejo/workflows on git.pop.coop, and
# the coverage gate (100 percent) is there.
#
# tests/coverage.sh: the bats suite of bin/ under kcov. Here the tests must
# pass; the coverage threshold is not enforced. The call goes to the file in
# the working tree, so a pull request that changes github-test-shell.yml is
# tested by its own version.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/github-test-shell.yml
    with:
      threshold: 100
