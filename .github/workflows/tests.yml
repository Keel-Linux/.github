# The gate of this repository, beside the actionlint one (docs/ci-cd.md):
#   tests / coverage   tests/coverage.sh: the bats suite of bin/ under kcov,
#                      100 percent, the number measured on main. The tools
#                      here run in every other repository's gate, so they are
#                      tested here rather than in the workflows that call them.
# Required on main. Thresholds are only ever raised.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 100
