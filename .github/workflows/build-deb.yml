# Reusable: build a Debian binary package with dpkg-buildpackage on the
# self-hosted LXC runner and keep the .deb as a workflow artifact.
#
# Inactive until a runner with the labels "self-hosted, keel-lxc" is
# registered (docs/ci-cd.md in the keel repository): a job that targets a
# label no runner carries stays queued and is cancelled after 24 hours, so
# callers gate it on the organization variable KEEL_LXC_RUNNER:
#
#   jobs:
#     package:
#       if: vars.KEEL_LXC_RUNNER == 'true'
#       uses: keel-linux/.github/.github/workflows/build-deb.yml@main
#
# A caller job named "package" produces the status check "package / deb".
# The artifact is the only place the package is published today: APT
# repository publication waits on the signing key and hosting (decision 0005).
name: build-deb

on:
  workflow_call:
    inputs:
      source-dir:
        description: directory holding debian/ (default the repository root)
        required: false
        type: string
        default: "."
      artifact-name:
        description: name of the uploaded artifact
        required: false
        type: string
        default: deb
      retention-days:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  deb:
    runs-on: [self-hosted, keel-lxc]
    timeout-minutes: 60
    env:
      SOURCE_DIR: ${{ inputs.source-dir }}
      DEB_BUILD_OPTIONS: nocheck
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          cd "$SOURCE_DIR"
          test -f debian/control || { echo "::error::$SOURCE_DIR/debian/control not found"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential devscripts equivs
          sudo apt-get build-dep -y -qq .
      - name: Build the binary package
        run: |
          cd "$SOURCE_DIR"
          dpkg-buildpackage -us -uc -b
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv ../*.deb ../*.buildinfo ../*.changes "$GITHUB_WORKSPACE/dist/"
          ls -l "$GITHUB_WORKSPACE/dist" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
