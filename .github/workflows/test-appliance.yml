# Reusable: boot the layer an appliance has already published, and run the
# appliance repository's own tests/boot-test.sh against it.
#
# What this job proves, and what it does not. It fetches the layer from the
# project mirror, verifies it, assembles the chain into one or more scratch
# rootfs trees, boots them in LXC containers on one bridge and runs the
# repository's boot test, after upgrading each rootfs (below). The layer was
# built and published before the run started, so what it proves is that the
# published layer, brought up to date, boots. It is not evidence about the
# recipe: on a pull request that changes it, the layer on the mirror is the
# one built from the default branch, so the change is never exercised here. The job id says as much,
# because until 2026-09-28 it was `build-and-boot`, and a name that reads
# like "this branch was built and booted" was taken for exactly that when
# branch protection was applied. Nothing here builds a layer.
#
# The value it does have is real and worth keeping: it catches a published
# layer that no longer boots, and it catches the parent mismatch it was
# written for.
#
# What boots is not the published layer exactly as it was published. The
# first time the boot test starts a container, bin/unprivileged-lxc boots it
# once with the first boot units masked and runs bin/upgrade-rootfs inside
# it, confined like the appliance itself (its own idmap, the same AppArmor
# profile, nothing of it on the runner), then stops it and starts it as the
# test asked: apt-get full-upgrade from deb.debian.org and
# archive.keellinux.org trixie-testing (fetched by the runner, which the
# containers cannot reach, and checked by apt inside), then, when the
# caller names one with `package_artifact`, the .deb files this run built
# from the pull request. So the boot tests "published layer + current
# testing + this pull request's package", which is what an operator has
# after `apt upgrade`. Until 2026-10-03 it booted the layer untouched, and a
# published layer whose first boot was broken failed every pull request,
# the one carrying the fix included, so the check had to be lifted by hand
# (tracker#53; keel-core#24, keel-web#4). The versions that differ from the
# published layer are in the job log and the job summary, written before
# the boot, so a failure says what was booted. The recipe is still not
# built: a change to it is not exercised here.
#
# A layer that has never been published fails this job. Before 2026-09-28 it
# passed with a notice, and a notice is not a conclusion: branch protection
# and `gh pr checks` read the conclusion, so keel-redis#5 carried a green
# gate produced in 11 seconds by a job that pulled, verified and booted
# nothing. GitHub leaves a workflow job no third answer to reach for: a job
# skipped by `if:` reports success and does not block a merge (Actions
# documentation, "Using conditions to control job execution"), and `exit 78`,
# the old neutral conclusion, is a plain failure now (measured on this
# repository, run 36372853847). Failure is the only conclusion that withholds
# a merge, so an unpublished layer fails, and a repository whose first layer
# does not exist yet says so with `allow_unpublished`.
#
# The decision taken from the mirror's answer is bin/appliance-gate of this
# repository, unit tested in tests/appliance-gate.bats and measured by
# tests/coverage.sh, because the honesty of the gate is the part most worth
# having tests on (decision 0004). This job holds the curl; the script
# decides what may be claimed from its answer.
#
# One container is the default. A repository that needs several declares
# them with the `roles` input, one role name per node: `roles: "primary
# replica"` for replication, `roles: "galera galera galera"` for a three
# node cluster later. The number of nodes is the number of names, so
# nothing in this workflow assumes two. How each node learns which one it
# is, and how a test addresses another one, is lib/boot-test-nodes.sh of
# this repository, which the job checks out and hands to the boot test with
# --nodes-lib; that file is unit tested here because this is the repository
# with a gate on it.
#
# Why it fetches instead of building: the self-hosted runner keel-lxc-1
# lives on the public services VM (docs/releases-host.md of the keel
# repository), which has lxc, kcov, bats, zstd and python3-yaml but no
# fab, deck or buildtasks and no /turnkey trees. The build host builds and
# publishes the layers, this runner consumes them over IPv6. A job that
# called bt-layer here would fail on the first line. Building from the
# branch instead needs that build host, which is serialised behind a lock,
# so it does not fit a per-pull-request check and is not attempted here.
#
# keel comes from a checkout of keel-linux/keel at main, not from a
# package: decision 0005 is still open, nothing is signed, and
# archive.keellinux.org serves a README, so there is no keel package to
# install. The checkout needs only python3 and PyYAML, both already on the
# runner, and the commit it resolved to is printed in the job summary.
#
# A caller job named "appliance" produces the status check
# "appliance / boot-published-layer".
name: test-appliance

on:
  workflow_call:
    inputs:
      appliance:
        description: appliance name without the keel- prefix (core, nodebb, lamp)
        required: true
        type: string
      parent:
        description: >-
          Parent layer the recipe builds on, empty for a rootfs layer such as
          core. It is not needed to fetch anything, because keel pull follows
          the parent chain in the manifests itself. It is kept because it is
          checked against the parent the published manifest records, so a
          caller finds out when the mirror serves a layer built on something
          other than what the repository says.
        required: false
        type: string
        default: ""
      roles:
        description: >-
          One role name per node, separated by spaces, when the repository's
          boot test needs more than one container: "primary replica", or
          "galera galera galera". Empty, the default, is one container and
          exactly the single node behaviour every caller has today. The node
          count is the number of names and nothing here assumes two. Role
          names are lower case letters, digits and dashes; five nodes is the
          ceiling, because this runner is shared.
        required: false
        type: string
        default: ""
      allow_unpublished:
        description: >-
          A layer that has never been published cannot be booted, and by
          default that fails this job instead of passing it. A repository
          whose first layer does not exist yet sets this to true to say so
          out loud, in its own workflow file, where whoever reviews that
          repository sees it. The exemption dies on its own: once the
          manifest answers 200 this input is an error. Two ways that expiry
          does not happen on its own, both printed in the job summary of a
          run that uses it: the error only stops somebody where this check
          is a required status, and it keys on the name declared in
          `appliance`, so a typo there answers 404 for ever and the
          exemption never expires.
        required: false
        type: boolean
        default: false
      tooling_ref:
        description: >-
          Ref of keel-linux/.github this job takes bin/appliance-gate and
          lib/boot-test-nodes.sh from. The default, main, is what every
          caller uses and the only value any of them should set. It is an
          input because nothing else checks a change to this workflow before
          it merges: tests/coverage.sh exercises the script on its own and
          no job exercises it in place, so a pull request here would
          otherwise run a new workflow against main's copy of the script. A
          temporary caller pointed at a branch of keel-linux/.github sets
          this to that same branch, and the job then runs the workflow and
          the tooling from one commit. It should be github.job_workflow_sha
          and no input at all; actionlint 1.7.7 does not know that property
          and this organization's lint gate fails on any finding.
        required: false
        type: string
        default: main
      package_artifact:
        description: >-
          Name of an artifact of this workflow run holding the .deb files
          built from the pull request, as lxc-trixie.yml uploads them with
          artifact-name. They are installed over the upgraded rootfs before
          the first boot, at their own version even when the archive has a
          newer one. An artifact is only visible inside the run that
          uploaded it, so the calling job sits in the same workflow as the
          build and `needs:` it. Empty, the default, installs nothing of the
          pull request's own.
        required: false
        type: string
        default: ""
      timeout:
        description: minutes before the job is cancelled
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  # A job skipped by its `if:` reports success, and branch protection counts
  # a skipped required check as passed. So on a pull request from a fork
  # "appliance / boot-published-layer" shows as skipped and would let the
  # pull request through having booted nothing. This job, on a hosted
  # runner, fails in that case and only then, so the pull request carries a
  # red "appliance / fork-not-booted" that says why. It blocks a merge only
  # where it is a required check; the way to test a fork's change is to push
  # it to a branch of the repository itself.
  fork-not-booted:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to boot a fork's pull request on keel-lxc-1
        run: |
          echo "::error::pull requests from forks are not booted on keel-lxc-1; push the change to a branch of $GITHUB_REPOSITORY to run the appliance gate"
          exit 1

  boot-published-layer:
    # Code from a fork never reaches keel-lxc-1, which shares its VM with
    # keellinux.org; the approval policy for outside contributors is the
    # first gate and this is the second. pull_request_target runs with the
    # base repository's rights and is refused outright.
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, keel-lxc]
    timeout-minutes: ${{ inputs.timeout }}
    env:
      APPLIANCE: ${{ inputs.appliance }}
      PARENT: ${{ inputs.parent }}
      ROLES: ${{ inputs.roles }}
      ALLOW_UNPUBLISHED: ${{ inputs.allow_unpublished }}
      # Read by bin/appliance-gate, which puts a ::warning:: on the run when
      # it is not main. An input that substitutes the logic deciding what
      # this job may claim is held to the same standard as
      # allow_unpublished: it does not get to be invisible.
      TOOLING_REF: ${{ inputs.tooling_ref }}
      PACKAGE_ARTIFACT: ${{ inputs.package_artifact }}
      SOURCE: https://mirror.keellinux.org/layers
      GATE: ${{ github.workspace }}/.keel-ci/bin/appliance-gate
      UNPRIVILEGED_LXC: ${{ github.workspace }}/.keel-ci/bin/unprivileged-lxc
      NODES_LIB: ${{ github.workspace }}/.keel-ci/lib/boot-test-nodes.sh
      # One scratch tree per run and per attempt, so two runs never share a
      # rootfs or a layer cache. NAME is the container name with one node
      # and the base the node names are derived from with several, which is
      # btn_node_name: NAME-1, NAME-2, NAME-3.
      NAME: keel-${{ inputs.appliance }}-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SCRATCH: /var/tmp/keel-ci/keel-${{ inputs.appliance }}-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TERM: dumb
    steps:
      # The name ends up in paths, container names and the mirror URL.
      - name: Check the appliance name
        id: name
        run: |
          if [[ ! $APPLIANCE =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::appliance '$APPLIANCE' is not a name: lower case letters, digits and dashes only"
            exit 1
          fi

      # No credentials stay in .git/config: the boot test runs as root in a
      # user namespace that can read the whole workspace.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The gate's own tooling: bin/appliance-gate, which decides what this
      # job may claim from the mirror's answer, and lib/boot-test-nodes.sh,
      # which the boot test sources. It should be pinned to
      # github.job_workflow_sha, the commit this reusable workflow is
      # running from, so a caller pinned to a tag would get the tooling
      # belonging to that tag; actionlint 1.7.7 does not know that property
      # and this organization's lint gate fails on any finding, so it
      # defaults to main, which is the ref every caller uses
      # (profile/WORKFLOWS.md).
      #
      # The consequence, until that property can be used: a pull request
      # against keel-linux/.github that changes bin/appliance-gate or the
      # wiring below runs against main's copy of it, so nothing here checks
      # the change. The manual procedure in profile/WORKFLOWS.md, a
      # temporary caller setting tooling_ref to the branch, is the only
      # check there is, and it has to be done by hand.
      - name: Check out the gate's own tooling
        uses: actions/checkout@v7
        with:
          repository: keel-linux/.github
          ref: ${{ inputs.tooling_ref }}
          path: .keel-ci
          persist-credentials: false

      - name: Record where the gate's logic came from
        run: |
          set -eu
          commit=$(git -C .keel-ci rev-parse HEAD)
          echo "KEEL_CI_COMMIT=$commit" >> "$GITHUB_ENV"
          # Written here rather than in the Summary step, which only runs
          # when a layer was published: the exemption path concludes success
          # without booting, and that is exactly the path where a
          # substituted tooling_ref would otherwise leave no trace outside
          # the raw step environment.
          {
            echo "### Gate tooling"
            echo
            echo "\`keel-linux/.github\` at \`$TOOLING_REF\`, commit \`$commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the declared roles
        if: inputs.roles != ''
        run: |
          set -eu
          # shellcheck source=/dev/null
          . "$NODES_LIB"
          echo "$(btn_node_count "$ROLES") nodes declared: $ROLES"
          btn_nodes "$NAME" "$ROLES"

      - name: Ask the mirror for the layer, and decide what may be claimed
        id: layer
        run: |
          set -eu
          manifest=$SCRATCH-manifest
          mkdir -p "$(dirname "$manifest")"
          # Only an answer of 404 means "not published yet". A name that does
          # not resolve, a refused connection or a 5xx is the mirror being
          # unreachable, and reading one of those as "not published" would
          # turn every outage into a check that tested nothing.
          #
          # The family is left to the resolver rather than forced with -6,
          # which is what keel pull does too. On keel-lxc-1 the mirror is this
          # same host and its own public name resolves to the machine itself,
          # so the request never leaves it; anywhere the name has an AAAA
          # record it goes over IPv6.
          status=$(curl -sS --retry 2 --retry-delay 3 -o "$manifest" \
                     -w '%{http_code}' "$SOURCE/$APPLIANCE.manifest") || {
            code=$?
            rm -f "$manifest"
            echo "::error::cannot reach $SOURCE ($APPLIANCE.manifest): curl exited $code"
            exit 1
          }
          [ "$status" = 200 ] || rm -f "$manifest"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          # bin/appliance-gate writes published=true or published=false to
          # GITHUB_OUTPUT, writes the job summary for whatever it decided,
          # and exits non-zero on every state this job must not pass: a
          # layer that was never published and not declared as such, a
          # declared exemption that has outlived the layer it excused, any
          # answer that is neither 200 nor 404, and a decision it could not
          # write down.
          "$GATE" "$status" "$APPLIANCE" "$SOURCE" "$ALLOW_UNPUBLISHED"
          # Every boot step below is guarded by published == 'true', so a
          # decision that did not reach GITHUB_OUTPUT would skip all of them
          # and leave this job green having booted nothing, which is the
          # defect the gate exists to remove. The script makes that write
          # fatal; this reads the file back so that the guard those steps
          # depend on is checked here rather than assumed.
          decided=$(awk -F= '$1 == "published" { print $2 }' "$GITHUB_OUTPUT" | tail -1)
          case "$decided" in
            true|false) echo "the gate recorded published=$decided" ;;
            *) echo "::error::the gate exited 0 without recording a decision, so every boot step would be skipped"
               exit 1 ;;
          esac

      - name: Check out keel and put it on PATH
        if: steps.layer.outputs.published == 'true'
        run: |
          set -eu
          rm -rf .keel
          git clone --quiet --depth 1 https://github.com/keel-linux/keel.git .keel
          mkdir -p .keel/bin
          cat > .keel/bin/keel <<'WRAPPER'
          #!/bin/sh
          # keel from the checkout of keel-linux/keel next to this script.
          PYTHONPATH=$(cd "$(dirname "$0")/.." && pwd)
          export PYTHONPATH
          exec python3 -m keel "$@"
          WRAPPER
          chmod +x .keel/bin/keel
          echo "$GITHUB_WORKSPACE/.keel/bin" >> "$GITHUB_PATH"
          echo "KEEL_COMMIT=$(git -C .keel rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check the published parent against the caller
        if: steps.layer.outputs.published == 'true'
        env:
          MANIFEST: ${{ steps.layer.outputs.manifest }}
        run: |
          set -eu
          published=$(awk '$1 == "parent" { print $2 }' "$MANIFEST")
          declared=${PARENT:-none}
          echo "manifest says parent $published, the caller declares $declared"
          if [ "$published" != "$declared" ]; then
            echo "::error::the published $APPLIANCE layer was built on '$published', the caller declares '$declared'"
            exit 1
          fi

      - name: Pull the layer chain from the mirror
        if: steps.layer.outputs.published == 'true'
        run: |
          set -eu
          mkdir -p "$SCRATCH/cache" "$SCRATCH/lxc"
          keel pull "$APPLIANCE" --source "$SOURCE" --cache-dir "$SCRATCH/cache" --non-interactive

      - name: Verify the layers
        if: steps.layer.outputs.published == 'true'
        run: |
          set -eu
          code=0
          keel verify --layers-dir "$SCRATCH/cache" --non-interactive || code=$?
          case "$code" in
            0) echo "every layer matches its manifest" ;;
            8) echo "::notice::keel verify exited 8: the layers match their manifests and carry a hash file that is not signed. Expected until the release key of decision 0005 exists" ;;
            9) echo "keel verify exited 9: every layer matches; the package half of the check is not implemented yet" ;;
            6) echo "::error::keel verify exited 6: a manifest is invalid"; exit 6 ;;
            7) echo "::error::keel verify exited 7: a tarball, a parent chain or a digest does not match its manifest"; exit 7 ;;
            *) echo "::error::keel verify exited $code"; exit "$code" ;;
          esac

      # The pull request's packages, which bin/upgrade-rootfs installs in
      # the container after the upgrade. bin/unprivileged-lxc reads them from ULX_DEBS.
      - uses: actions/download-artifact@v8
        if: steps.layer.outputs.published == 'true' && inputs.package_artifact != ''
        with:
          name: ${{ inputs.package_artifact }}
          path: .keel-ci-debs

      - name: Hand the pull request's packages to the upgrade
        if: steps.layer.outputs.published == 'true' && inputs.package_artifact != ''
        run: |
          set -eu
          debs=$(find .keel-ci-debs -maxdepth 1 -name '*.deb' -type f -printf '%f\n' | sort)
          if [ -z "$debs" ]; then
            echo "::error::the artifact $PACKAGE_ARTIFACT holds no .deb file"
            exit 1
          fi
          echo "installed after the upgrade, from $PACKAGE_ARTIFACT:"
          echo "$debs"
          echo "ULX_DEBS=$GITHUB_WORKSPACE/.keel-ci-debs" >> "$GITHUB_ENV"

      - name: Upgrade and boot the published layer, then run the appliance's boot test
        if: steps.layer.outputs.published == 'true'
        run: |
          set -eu
          test -x tests/boot-test.sh || {
            echo "::error::tests/boot-test.sh is missing or not executable in this repository"
            exit 1
          }
          # With several nodes the boot test is given the role list, the
          # library that turns it into container names, and a path to write
          # the topology it ended up with, which the summary step renders.
          # With one node none of this is passed, so a repository that has
          # never heard of --roles is called exactly as before.
          nodes=()
          if [ -n "$ROLES" ]; then
            nodes=(--roles "$ROLES" --nodes-lib "$NODES_LIB"
                   --nodes-report "$SCRATCH/nodes")
          fi
          # The boot test insists on root, to assemble the rootfs and start
          # the container. The runner has no sudo since 2026-10-01: the test
          # is root in a user namespace mapped onto the runner's subordinate
          # ids, which are the ids the container runs as, and its LXC
          # commands reach unprivileged LXC through bin/unprivileged-lxc of
          # this repository (docs/ci-cd.md section 6 of the keel
          # repository). Its first lxc-start of a container is preceded by
          # the upgrade boot (header of this file). stdin is /dev/null so
          # that a forwarded lxc-attach only ever reads what the test pipes
          # into it.
          "$UNPRIVILEGED_LXC" run "$SCRATCH" -- \
            "$GITHUB_WORKSPACE/tests/boot-test.sh" "$APPLIANCE" \
            --name "$NAME" \
            --layers-dir "$SOURCE" \
            --cache-dir "$SCRATCH/cache" \
            --lxc-path "$SCRATCH/lxc" \
            --bridge lxcbr0 \
            --timeout 900 --interval 5 \
            "${nodes[@]+"${nodes[@]}"}" < /dev/null

      - name: Summary
        if: steps.layer.outputs.published == 'true'
        env:
          MANIFEST: ${{ steps.layer.outputs.manifest }}
        run: |
          set -eu
          # What the layer that booted was built from, read off its own
          # manifest. It is the answer to the question this job is most
          # often asked by mistake, "did the change boot", and the answer is
          # that what booted here predates the change.
          built=$(awk '$1 == "product_commit" { print $2 }' "$MANIFEST")
          pool=$(awk '$1 == "pool" { print $2 }' "$MANIFEST")
          {
            echo "## The published $APPLIANCE layer booted, upgraded"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| appliance | \`$APPLIANCE\` |"
            echo "| parent | \`${PARENT:-none}\` |"
            echo "| source | \`$SOURCE\` |"
            echo "| built from | \`${built:-unrecorded}\`, pool \`${pool:-unrecorded}\` |"
            echo "| upgraded from | Debian trixie, archive.keellinux.org trixie-testing |"
            echo "| pull request's packages | \`${PACKAGE_ARTIFACT:-none}\` |"
            echo "| nodes | \`${ROLES:-one}\` |"
            echo "| container | \`$NAME\` |"
            echo "| keel | \`$KEEL_COMMIT\` |"
            echo
            echo "This booted the layer the mirror publishes, built before this"
            echo "run, upgraded from the archives and with the pull request's"
            echo "packages when the row above names an artifact; the versions"
            echo "that changed are listed above. The recipe was not built: a"
            echo "change to it is not exercised here."
          } >> "$GITHUB_STEP_SUMMARY"
          # The topology comes from the boot test, which is the only thing
          # that knows the addresses the bridge handed out, and is rendered
          # by the same library the test built it with.
          if [ -n "$ROLES" ] && [ -r "$SCRATCH/nodes" ]; then
            # shellcheck source=/dev/null
            . "$NODES_LIB"
            {
              echo
              echo "| Node | Role | Container | Address |"
              echo "| --- | --- | --- | --- |"
              btn_summary_rows "$(cat "$SCRATCH/nodes")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Destroy every container and the scratch rootfs
        # Always, except when the appliance name was refused (or never
        # checked): SCRATCH and NAME are built from it, and a cleanup must
        # not act on a path made from a name nobody validated. Nothing was
        # created before that check, so nothing is left behind.
        if: always() && steps.name.outcome == 'success'
        run: |
          set -u
          # Whatever the outcome, including a cancelled run, which reaches
          # this step because the condition is always(). Two containers left
          # on a shared build host cost somebody else a debugging session.
          #
          # The containers are enumerated from LXC rather than recomputed
          # from the role list, so a node the test added, renamed or started
          # before it failed is torn down too, and so this step needs no
          # agreement with the test about how many there were. Every node is
          # stopped before the tree goes: removing it first would delete the
          # configuration of the nodes not stopped yet, leaving their init
          # processes running on a rootfs that no longer exists. The
          # containers are the runner's own unprivileged ones, so it stops
          # them without sudo.
          if [ -d "$SCRATCH/lxc" ]; then
            for container in $(lxc-ls -P "$SCRATCH/lxc" -1 2>/dev/null || true); do
              echo "stopping $container"
              lxc-stop -P "$SCRATCH/lxc" -n "$container" -k >/dev/null 2>&1 || true
            done
          fi
          # Removes the scratch tree: the layer cache, every rootfs and the
          # topology report. The rootfs belongs to the runner's subordinate
          # ids, so the removal happens in the same user namespace the
          # assemble did. Safe to run twice, which is what it is for.
          if [ -x "$UNPRIVILEGED_LXC" ]; then
            "$UNPRIVILEGED_LXC" cleanup "$SCRATCH" || true
          else
            echo "::warning::$UNPRIVILEGED_LXC is missing, $SCRATCH cannot be removed here"
          fi
          rm -f "$SCRATCH-manifest"
          if [ -e "$SCRATCH" ]; then
            echo "::warning::$SCRATCH still exists after cleanup"
          fi
          # lxc-ls reads the lxcpath, which is gone by now, so it would say
          # nothing either way. The monitor process of a container that
          # survived still carries the path in its command line, and that is
          # the thing worth reporting: it is what a later run would trip on.
          left=$(pgrep -af 'lxc monitor' 2>/dev/null | grep -c "$SCRATCH" || true)
          echo "monitor processes of this run still alive: $left"
          if [ "$left" != 0 ]; then
            echo "::warning::$left container monitor(s) of this run survived cleanup"
          fi
