# Light CI on GitHub-hosted runners, for pull requests on the GitHub mirror
# (decision 0056). The full CI is .forgejo/workflows on git.pop.coop.
#
# actionlint over the workflows of this repository. The call goes to the
# file in the working tree, so a pull request that changes github-lint.yml
# is linted by its own version.
name: lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/github-lint.yml
