# Light CI on GitHub-hosted runners, for pull requests on the GitHub mirror
# (decision 0056). The full CI is .forgejo/workflows on git.pop.coop.
#
# The security scan of this repository. It calls github-security-scan.yml
# from the working tree, and the shared tooling at the head commit of the
# pull request, so a pull request that changes either is scanned by its own
# version. shellcheck is always on: lint.yml runs shellcheck only on the
# run blocks of the workflows.
name: security

on:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/github-security-scan.yml
    with:
      shellcheck: always
      tooling-ref: ${{ github.event.pull_request.head.sha }}
