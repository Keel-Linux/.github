# Reusable: the repository's tests/coverage.sh (bats under kcov) with the
# threshold exported as COVERAGE_THRESHOLD. A caller job named "tests"
# produces the status check "tests / coverage".
#
# Bootstrap rule: when the coverage script does not exist yet and the
# threshold is 0 (nothing measured on this branch), the job succeeds with a
# notice so the check exists and protection can require it. A missing script
# with a threshold above 0 is a failure.
#
# The job also refuses a bats suite that contains an inert negation,
# whether or not it has a coverage script, because such a test asserts
# nothing and measuring it would report coverage of an assertion that never
# runs.
name: test-shell

on:
  workflow_call:
    inputs:
      threshold:
        description: minimum kcov line coverage percentage for the measured files
        required: true
        type: number
      coverage-script:
        description: repository script that runs bats under kcov and fails below COVERAGE_THRESHOLD
        required: false
        type: string
        default: tests/coverage.sh
      apt-packages:
        description: extra Debian packages needed by the tests
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERAGE_THRESHOLD: ${{ inputs.threshold }}
      COVERAGE_SCRIPT: ${{ inputs.coverage-script }}
      APT_PACKAGES: ${{ inputs.apt-packages }}
      # Ubuntu 24.04 (ubuntu-latest) ships no kcov package, so the release the
      # baselines were measured with (43, the Debian trixie version) is built
      # from the pinned tarball and cached between runs.
      KCOV_VERSION: "43"
      KCOV_SHA256: 4cbba86af11f72de0c7514e09d59c7927ed25df7cebdad087f6d3623213b95bf
    steps:
      - uses: actions/checkout@v4
      # A bats negation only asserts when it is the last command of the test
      # body: bash does not apply errexit to a negated command, so every
      # earlier `! cmd` is inert and its test passes whatever the code does.
      # shellcheck grades the two cases apart, error for the inert ones and
      # note for the rest, so --severity=error reports exactly the dead
      # assertions it can see: SC2314 for `! cmd` and `! a | b`, SC2315 for
      # `! [[ ... ]]`. It sees only a negation at the top level of the body,
      # so the awk program looks one level down: a `!` after `&&`, `||` or
      # `;`, in a loop or a conditional branch, in a group or a substitution,
      # on any line of the body but its last. That last line still decides
      # the test, as `[ ! -f "$f" ] || ! grep -q x "$f"` does, so it is not a
      # failure; every other one is inert or, in a loop, decided by the last
      # iteration alone. A line both report is listed once.
      # It runs before the coverage job's own work because it needs nothing
      # but a checkout, and a suite that is not asserting is not worth
      # measuring. Measured on 2026-09-28 over every default branch in the
      # organization that carries a bats file: 57 dead assertions in eight
      # repositories, twelve of them all but one of an IPv6 validator's
      # rejection cases.
      - name: Negations that assert
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          }
          status=0
          git ls-files -z '*.bats' \
            | xargs -0 -r shellcheck -f gcc --shell=bash \
                --severity=error --include=SC2314,SC2315 \
                > "$RUNNER_TEMP/shellcheck.txt" || status=$?
          # shellcheck disable=SC2016  # an awk program, expanded by awk
          git ls-files -z '*.bats' \
            | xargs -0 -r awk '
                FNR == 1 { body = 0 }
                /^@test .*\{[[:space:]]*$/ { body = 1; n = 0; next }
                body && /^\}[[:space:]]*$/ {
                  for (i = 1; i < n; i++) if (neg[i])
                    print FILENAME ":" num[i] ": error: a nested negation that is not on the last line of the test asserts nothing"
                  body = 0; next
                }
                body && !/^[[:space:]]*(#|$)/ {
                  n++; num[n] = FNR; neg[n] = 0
                  cmd = $0
                  sub(/^[[:space:]]+/, "", cmd)
                  if (cmd ~ /^(if|elif|while|until)[[:space:]]/)
                    if (!sub(/.*[;[:space:]](then|do)[[:space:]]/, " ", cmd)) next
                  if (cmd ~ /(^|[;&|{()]|[[:space:]](do|then|else))[[:space:]]*![[:space:]]/ &&
                      cmd !~ /(^|[;&|{()])[[:space:]]*run[[:space:]]+![[:space:]]/)
                    neg[n] = 1
                }' > "$RUNNER_TEMP/nested.txt" || status=$?
          # shellcheck disable=SC2016  # an awk program, expanded by awk
          awk -F: 'NR == FNR { seen[$1 ":" $2] = 1; print; next }
                   !(($1 ":" $2) in seen)' "$RUNNER_TEMP/shellcheck.txt" "$RUNNER_TEMP/nested.txt" \
            | sort -t: -k1,1 -k2,2n > "$RUNNER_TEMP/inert-negations.txt"
          if [ -s "$RUNNER_TEMP/inert-negations.txt" ]; then
            cat "$RUNNER_TEMP/inert-negations.txt"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::a bats negation that is not the last command of its test asserts nothing; write it 'run ! cmd' (needs bats_require_minimum_version 1.5.0)"
          fi
          {
            echo "## Negations that assert"
            echo '```'
            if [ -s "$RUNNER_TEMP/inert-negations.txt" ]; then
              cat "$RUNNER_TEMP/inert-negations.txt"
            else
              echo "no inert negations in $(git ls-files '*.bats' | wc -l) bats files"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Check for the coverage script
        id: script
        run: |
          if [ -x "$COVERAGE_SCRIPT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -e "$COVERAGE_SCRIPT" ]; then
            echo "::error::$COVERAGE_SCRIPT exists but is not executable (git update-index --chmod=+x)"
            exit 1
          elif [ "$COVERAGE_THRESHOLD" = "0" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$COVERAGE_SCRIPT is not on this branch and the threshold is 0: nothing is measured yet, the check passes as a bootstrap placeholder"
            {
              echo "## Coverage"
              echo "No coverage script (\`$COVERAGE_SCRIPT\`) on this branch and threshold 0: nothing measured yet."
              echo "The check passes as a placeholder until the tests land and the threshold is raised."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::$COVERAGE_SCRIPT is missing but the threshold is $COVERAGE_THRESHOLD: a coverage script is required"
            exit 1
          fi
      - name: Install bats, shellcheck and the kcov build dependencies
        if: steps.script.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086  # APT_PACKAGES is a space separated list
          sudo apt-get install -y -qq bats shellcheck file cmake binutils-dev \
            libssl-dev libcurl4-openssl-dev libelf-dev libdw-dev libiberty-dev \
            zlib1g-dev $APT_PACKAGES
      - name: Restore kcov from the cache
        if: steps.script.outputs.present == 'true'
        id: kcov-cache
        uses: actions/cache@v4
        with:
          path: ~/kcov
          key: kcov-${{ env.KCOV_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Build kcov from the pinned release tarball
        if: steps.script.outputs.present == 'true' && steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o kcov.tar.gz \
            "https://github.com/SimonKagstrom/kcov/archive/refs/tags/v$KCOV_VERSION.tar.gz"
          echo "$KCOV_SHA256  kcov.tar.gz" | sha256sum -c -
          tar xzf kcov.tar.gz
          cmake -S "kcov-$KCOV_VERSION" -B kcov-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/kcov"
          cmake --build kcov-build --parallel "$(nproc)"
          cmake --install kcov-build
      - name: Put kcov on PATH
        if: steps.script.outputs.present == 'true'
        run: |
          echo "$HOME/kcov/bin" >> "$GITHUB_PATH"
          "$HOME/kcov/bin/kcov" --version
      - name: Static analysis (advisory)
        if: steps.script.outputs.present == 'true'
        run: |
          git ls-files | grep -E '^(bin/|tests/|.*\.sh$|.*\.bash$)' | xargs -r file | grep -iE 'shell script|bash' | cut -d: -f1 | xargs -r shellcheck -S warning || true
      - name: Tests and coverage gate
        if: steps.script.outputs.present == 'true'
        run: |
          set -o pipefail
          status=0
          "$COVERAGE_SCRIPT" 2>&1 | tee coverage.txt || status=$?
          {
            echo "## Coverage (threshold $COVERAGE_THRESHOLD percent)"
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && steps.script.outputs.present == 'true'
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: ignore
