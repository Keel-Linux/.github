name: test-shell

on:
  workflow_call:
    inputs:
      threshold:
        description: minimum kcov line coverage percentage for the measured files
        required: true
        type: number
      coverage-script:
        description: repository script that runs bats under kcov and fails below the threshold
        required: false
        type: string
        default: tests/coverage.sh
      apt-packages:
        description: extra Debian packages needed by the tests
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and kcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats kcov shellcheck ${{ inputs.apt-packages }}
      - name: Static analysis
        run: |
          git ls-files | grep -E '^(bin/|tests/|.*\.sh$|.*\.bash$)' | xargs -r file | grep -iE 'shell script|bash' | cut -d: -f1 | xargs -r shellcheck -S warning || true
      - name: Tests and coverage gate
        env:
          COVERAGE_THRESHOLD: ${{ inputs.threshold }}
        run: |
          test -x "${{ inputs.coverage-script }}" || { echo "missing ${{ inputs.coverage-script }}"; exit 1; }
          "${{ inputs.coverage-script }}" | tee coverage.txt
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
