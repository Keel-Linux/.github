# Reusable: pytest under coverage.py with branch coverage and a fail-under
# gate. A caller job named "tests" produces the status check "tests / coverage".
name: test-python

on:
  workflow_call:
    inputs:
      threshold:
        description: minimum coverage percentage (lines and branches)
        required: true
        type: number
      package:
        description: python package or source directory to measure
        required: true
        type: string
      tests:
        description: tests directory
        required: false
        type: string
        default: tests
      python-version:
        required: false
        type: string
        default: "3.13"
      apt-packages:
        description: extra Debian packages needed by the tests
        required: false
        type: string
        default: ""
      workers:
        description: >-
          number of pytest-xdist workers; empty runs one process, as before.
          Coverage is measured in every worker with pytest-cov.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  coverage:
    runs-on: keel-host
    timeout-minutes: 30
    env:
      THRESHOLD: ${{ inputs.threshold }}
      PACKAGE: ${{ inputs.package }}
      TESTS: ${{ inputs.tests }}
      APT_PACKAGES: ${{ inputs.apt-packages }}
      WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v7
      - name: Python in a virtual environment (the system python3 of the runner host)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install test tools
        run: |
          if [ -n "$APT_PACKAGES" ]; then
            # shellcheck disable=SC2086  # a space separated list of packages
            keel-need-packages $APT_PACKAGES
          fi
          python -m pip install --quiet pytest coverage pyyaml
          if [ -n "$WORKERS" ]; then
            python -m pip install --quiet pytest-xdist pytest-cov
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install --quiet -e . || echo "::warning::pip install -e . failed, running from the checkout with PYTHONPATH=."
          fi
      - name: Run tests under coverage
        run: |
          if [ -n "$WORKERS" ]; then
            PYTHONPATH=. python -m pytest -q -n "$WORKERS" --cov="$PACKAGE" \
              --cov-branch --cov-report= "$TESTS"
          else
            PYTHONPATH=. python -m coverage run --branch --source="$PACKAGE" -m pytest -q "$TESTS"
          fi
      - name: Enforce threshold
        run: |
          set -o pipefail
          status=0
          python -m coverage report --show-missing --fail-under="$THRESHOLD" | tee coverage.txt || status=$?
          {
            echo "## Coverage (threshold $THRESHOLD percent)"
            echo '```'
            tail -n 15 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: ignore
