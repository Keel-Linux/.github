# Reusable: pytest under coverage.py with branch coverage and a fail-under
# gate. A caller job named "tests" produces the status check "tests / coverage".
name: test-python

on:
  workflow_call:
    inputs:
      threshold:
        description: minimum coverage percentage (lines and branches)
        required: true
        type: number
      package:
        description: python package or source directory to measure
        required: true
        type: string
      tests:
        description: tests directory
        required: false
        type: string
        default: tests
      python-version:
        required: false
        type: string
        default: "3.13"
      apt-packages:
        description: extra Debian packages needed by the tests
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THRESHOLD: ${{ inputs.threshold }}
      PACKAGE: ${{ inputs.package }}
      TESTS: ${{ inputs.tests }}
      APT_PACKAGES: ${{ inputs.apt-packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install test tools
        run: |
          if [ -n "$APT_PACKAGES" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq $APT_PACKAGES
          fi
          python -m pip install --quiet pytest coverage pyyaml
          if [ -f pyproject.toml ]; then
            python -m pip install --quiet -e . || echo "::warning::pip install -e . failed, running from the checkout with PYTHONPATH=."
          fi
      - name: Run tests under coverage
        run: |
          PYTHONPATH=. python -m coverage run --branch --source="$PACKAGE" -m pytest -q "$TESTS"
      - name: Enforce threshold
        run: |
          set -o pipefail
          status=0
          python -m coverage report --show-missing --fail-under="$THRESHOLD" | tee coverage.txt || status=$?
          {
            echo "## Coverage (threshold $THRESHOLD percent)"
            echo '```'
            tail -n 15 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: ignore
