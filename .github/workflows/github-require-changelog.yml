# Reusable, light CI on GitHub-hosted runners (decision 0056).
#
# The repositories call this workflow from .github/workflows for pull
# requests on the GitHub mirror. The full CI is .forgejo/workflows on
# git.pop.coop. A pull request that changes what the package ships must
# also add a changelog entry, so that the change can reach a machine. The
# rule is bin/require-changelog of keel-linux/.github at main, the script
# that the Forgejo gate also runs. A caller job named "package" makes the
# check "package / changelog". The job uses no secret and has contents:
# read only.
name: github-require-changelog

on:
  workflow_call:
    inputs:
      changelog:
        description: path of the Debian changelog
        required: false
        type: string
        default: debian/changelog
      exempt:
        description: |
          extended regular expression of paths that ship nothing, matched
          against each changed path
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keel-linux/.github
          ref: main
          path: .keel-ci
          persist-credentials: false
      - name: A change that ships needs a changelog entry
        env:
          CHANGELOG: ${{ inputs.changelog }}
          EXEMPT: ${{ inputs.exempt }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          status=0
          if [ -n "$EXEMPT" ]; then
            .keel-ci/bin/require-changelog "$BASE" "$HEAD" "$CHANGELOG" "$EXEMPT" \
              2>&1 | tee changelog.txt || status=$?
          else
            .keel-ci/bin/require-changelog "$BASE" "$HEAD" "$CHANGELOG" \
              2>&1 | tee changelog.txt || status=$?
          fi
          {
            echo "## Changelog"
            echo '```'
            tail -n 20 changelog.txt
            echo '```'
            if [ "$status" -ne 0 ]; then
              echo
              echo "A change that ships without a new changelog entry cannot be"
              echo "installed, so it never reaches an appliance."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
