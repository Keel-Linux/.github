# The commissioning contract of keel-wordpress (decision 0075), kept here as
# the reference contract the tests read.
contract: 1
appliance: wordpress
secrets: [root, db, app]
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  - id: db_password
    hook: 35mysqlpass
    prompt: MariaDB password
    answer: secret:db
  - id: wordpress_db_password
    hook: 40wordpress
    prompt: WordPress database password
    answer: secret:db
  - id: wordpress_password
    hook: 40wordpress
    prompt: WordPress password
    answer: secret:app
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of keel-wordpress, with the secrets of the run
# and no instance name: the machine keeps the name pct create gave it
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: wordpress
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
    nginx: enabled
    coraza: disabled
    anubis: disabled
    # keel 0.23.82 refuses a spec that leaves out an overlay of the chain
    syncthing: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
    app_password: secret:app
  app:
    email: admin@example.org
    options:
      admin_user: admin
      site_title: WordPress
      db_user: wordpress
      db_name: wordpress
      db_prefix: wp_
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
proofs:
  - {secret: root, kind: shadow, user: root}
  - {secret: db, kind: mysql, user: wordpress, host: 127.0.0.1}
  - secret: app
    kind: command
    run: wp --allow-root --path=/var/www/wordpress user check-password admin "$SECRET"
services: [nginx, mariadb, php8.4-fpm, webmin, cron, postfix]
urls:
  - {url: 'https://127.0.0.1/', status: 200}
  - {url: 'https://127.0.0.1/wp-login.php', status: 200}
  - {url: 'https://127.0.0.1:12321/', status: 200}
forbidden:
  - {kind: mysql-database, name: keel_check}
  - {kind: hook, name: 40lnmp-check}
# The web pages of the gallery (decision 0075): the site, the backend
# before and after the login with the app secret, and Webmin with the root
# secret. A URL is a path on the machine; the port is 443 unless named.
screenshots:
  - {name: site, url: /}
  - name: wp-admin
    url: /wp-login.php
    after: /wp-admin/
    login: {user_field: '#user_login', user: admin, password_field: '#user_pass', secret: app, submit: '#wp-submit'}
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    wait: 8
# The cloud modes (decision 0076). The prompts are the titles of the
# confconsole screens, which are data here: a new title is a change of
# this file, not of keel-commission. The installer of the vm-iso pass
# takes the default screens of tkl-installer (no vm section).
cloud:
  capture:
    # keel1: an invite without a VIP, keel2: one that carries it (keel 0.23.83)
    invite: 'keel[12]:[A-Za-z0-9_.~+/=-]+'
    # the label anchors it: the usage screen shows the node's own addresses too
    vip: 'VIP:? +([0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,7})'
  # the screens on which a node waits for another: no key while they are up
  waits: [Waiting for the nodes]
  # the proofs across the pair, in order (keel 0.23.83 words: "carried
  # here: yes" on the node that holds the VIP; Syncthing folder types)
  checks:
    - {id: vip-holder, at: all, run: 'keel vip status', match: 'carried here: yes', count: 1}
    - {id: row-written, at: primary, run: 'mysql -e "CREATE DATABASE IF NOT EXISTS kc_probe; CREATE TABLE IF NOT EXISTS kc_probe.t (v INT); INSERT INTO kc_probe.t VALUES (42)"'}
    - {id: row-replicated, at: replica, run: 'sleep 5; mysql -N -e "SELECT v FROM kc_probe.t"', match: '^42$'}
    - {id: files-follow, at: replica, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'receiveonly'}
    - {id: files-sent, at: primary, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'sendonly'}
    - {id: promote, at: replica, run: 'keel vip promote'}
    - {id: promoted-holder, at: replica, run: 'keel vip status', match: 'carried here: yes'}
    - {id: return, at: primary, run: 'keel vip promote'}
    - {id: returned-holder, at: primary, run: 'keel vip status', match: 'carried here: yes'}
    - {id: probe-dropped, at: primary, run: 'mysql -e "DROP DATABASE kc_probe"'}
nodes:
  - name: primary
    site: br1
    mode: cloud_simple
    role: primary
    # the hotkeys of the menus (the first letter of an item): an arrow key is
    # an escape sequence, and the console of a container can hand dialog its
    # ESC alone, which cancels the screen (BR1, 2026-11-06)
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
  - name: replica
    site: br2
    mode: cloud_simple
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
    # the replica's database is read only and WordPress cannot record a
    # login there: its login page says so (keel-wordpress#42), and the shot
    # proves the notice instead of a login (BR2, 2026-11-06)
    screenshots:
      - {name: site, url: /}
      - {name: wp-login, url: /wp-login.php, text: This node is the replica of a cloud pair.}
      - name: webmin
        port: 12321
        url: /
        login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
        wait: 8
